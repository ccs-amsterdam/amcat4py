[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["amcat4py/"]

[project]
name = "amcat4py"
version = "4.2.0"
description = "Python client for AmCAT4 API"
authors = [
    { name = "Wouter van Atteveldt", email = "wouter@vanatteveldt.com" },
    { name = "Johannes B. Gruber" },
]
keywords = ["API", "text"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing",
]
dependencies = [
    "requests",
    "appdirs",
    "cryptography",
    "requests_oauthlib",
    "tqdm",
]

[dependency-groups]
dev = ["twine", "types-tqdm", "types-requests", "types-appdirs"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "requests_oauthlib"
ignore_missing_imports = true

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["amcat4py"]
